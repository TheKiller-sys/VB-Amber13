services:
  amber:
    build: .
    image: vb-amber13:latest
    container_name: vb-amber13
    restart: unless-stopped
    ports:
      # Dashboard: accesible desde fuera en el 3005, internamente usa el 3000
      - "3005:3000" 
      # noVNC: accesible desde fuera en el 6080
      - "6080:6080" 
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/vb-amber13.db
      VB_AMBER_SESSION_DIR: /app/data/sessions
      HOST: 0.0.0.0
      PORT: "3000" # Interno del contenedor, NO lo cambies
      VB_AMBER_SCRAPING_HEADLESS: "false"
    volumes:
      - amber-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 25s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  amber-data:
    driver: local
