services:
  amber:
    build: .
    image: vb-amber13:latest
    container_name: vb-amber13
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/vb-amber13.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - amber-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

volumes:
  amber-data:
    driver: local
